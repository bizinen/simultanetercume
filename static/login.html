<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Çeviri Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(56, 100, 220, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
            overflow: hidden;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-particles::before,
        .bg-particles::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        .bg-particles::before {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 100, 220, 0.08) 0%, transparent 70%);
            top: -100px;
            right: -50px;
            animation-delay: -5s;
        }

        .bg-particles::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            33% {
                transform: translateY(-20px) rotate(5deg);
            }

            66% {
                transform: translateY(15px) rotate(-3deg);
            }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, #3864dc 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(56, 100, 220, 0.3);
        }

        .login-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .login-header h1 {
            color: #f0f0f5;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #7a7a9a;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #a0a0c0;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e0e0f0;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3864dc;
            background: rgba(56, 100, 220, 0.06);
            box-shadow: 0 0 0 3px rgba(56, 100, 220, 0.15);
        }

        .form-group input::placeholder {
            color: #4a4a6a;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3864dc 0%, #5b78ef 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(56, 100, 220, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            animation: shake 0.4s ease;
        }

        .error-msg.visible {
            display: block;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #4a4a6a;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="bg-particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.5 21l5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 016-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364V3M3 11.621a48.474 48.474 0 016-.371m0 0c1.12 0 2.233.038 3.334.114M9 11.25V9m3.334 2.364V9" />
                    </svg>
                </div>
                <h1>Çeviri Sistemi</h1>
                <p>Yönetim paneline giriş yapın</p>
            </div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" name="username" placeholder="admin" autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" name="password" placeholder="••••••••"
                        autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Giriş Yap</span>
                    <span class="spinner"></span>
                </button>

                <div class="error-msg" id="errorMsg"></div>
            </form>

            <p class="footer-text">Simultane Tercüman Admin Panel</p>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // If already logged in, redirect
            var token = localStorage.getItem('auth_token');
            if (token) {
                // Verify token is still valid
                fetch('/api/config', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(function (r) {
                    if (r.ok) window.location.href = '/admin';
                }).catch(function () { /* ignore */ });
            }

            var form = document.getElementById('loginForm');
            var btn = document.getElementById('loginBtn');
            var errorDiv = document.getElementById('errorMsg');

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                errorDiv.classList.remove('visible');
                btn.classList.add('loading');
                btn.disabled = true;

                var username = document.getElementById('username').value.trim();
                var password = document.getElementById('password').value;

                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                })
                    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
                    .then(function (result) {
                        if (result.ok && result.data.token) {
                            localStorage.setItem('auth_token', result.data.token);
                            // Cookie is now set server-side with HttpOnly flag
                            window.location.href = '/admin';
                        } else {
                            showError(result.data.detail || result.data.message || 'Giriş başarısız');
                        }
                    })
                    .catch(function () {
                        showError('Sunucuya bağlanılamadı');
                    })
                    .finally(function () {
                        btn.classList.remove('loading');
                        btn.disabled = false;
                    });
            });

            function showError(msg) {
                errorDiv.textContent = msg;
                errorDiv.classList.add('visible');
            }

            // Focus first input
            document.getElementById('username').focus();
        })();
    </script>
</body>

</html>
